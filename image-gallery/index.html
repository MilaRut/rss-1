<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosy Gallery</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="My Gallery">
  <meta property="og:description" content="Discover my photo gallery with tags searching">
  <meta property="og:url" content="https://rolling-scopes-school.github.io/milarut-JSFEPRESCHOOL2024Q2/image-gallery/">
  <meta property="og:image"
    content="https://rolling-scopes-school.github.io/milarut-JSFEPRESCHOOL2024Q2/image-gallery/img/screenshot.png">
  <meta property="og:site_name" content="Cosy Gallery">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <div class="container">
        <div class="header__heading">
          <p>c
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M6.00001 6.99999L6.50001 7.49999M18 6.99999L17.5 7.49999M10 12V11.5M14 12V11.5M14 16H10M12 16V18M20.8 4.19999C19.2 2.59999 16.7 2.59999 15.1 4.19999L14.1 5.19999C12.7085 4.98251 11.2916 4.98251 9.90001 5.19999L8.90001 4.19999C8.16404 3.43086 7.15267 2.9856 6.0884 2.96216C5.02413 2.93871 3.99414 3.33901 3.22501 4.07499C2.45588 4.81096 2.01062 5.82233 1.98718 6.8866C1.96374 7.95087 2.36404 8.98086 3.10001 9.74999C2.38478 10.8702 2.00324 12.1709 2.00001 13.5C2.00001 18.2 6.50001 22 12 22C17.5 22 22 18.2 22 13.5C22.0063 12.1539 21.6244 10.8345 20.9 9.69999C22.4 8.09999 22.4 5.69999 20.8 4.19999Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            sy gallery
          </p>
          <label class="header__theme-switcher">
            <input type="checkbox" name="theme-switcher" id="theme-switcher">
          </label>
        </div>
        <div class="header__search">
          <form class="form">
            <input type="text" id="search-input" placeholder="Enter keywords" autocomplete="off">
            <button class="header__reset-btn" type="reset" title="Reset" aria-label="Reset"></button>
            <button class="header__submit-btn" type="submit" id="search-button" title="Search" aria-label="Search">
            </button>
          </form>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="container">
        <div class="loader">
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
          <div class="loader__item"></div>
        </div>
        <div class="gallery"></div>
        <span class="error-msg">Sorry, nothing was found for your request.</span>
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <ul class="footer__list">
          <li class="footer__item">
            <a href="https://github.com/MilaRut" class="footer__link">
              <img class="footer__img" src="./img/svg/github-white.svg" width="40" height="40" alt="GitHub.">
            </a>
          </li>
          <li class="footer__item">
            <a href="https://rs.school/courses/javascript-preschool-ru" class="footer__link">
              <div class="footer__img-wrapper">
                <img class="footer__img" src="./img/svg/rss-logo.svg" width="40" height="40" alt="RS School.">
              </div>
            </a>
          </li>
          <li class="footer__item">
            <p class="footer__date">2024</p>
          </li>
        </ul>
      </div>
    </footer>

    <div class="modal modal--preload">
      <div class="modal__wrapper">
        <div class="modal__overlay" data-close-modal></div>
        <div class="modal__content">
          <button class="modal__close-btn" type="button" aria-label="Закрыть окно." data-close-modal></button>
          <div class="modal__image"></div>
          <div class="modal__footer">
            <p class="modal__image-creds"></p>
            <p class="modal__copyright">on <a href="https://unsplash.com/" target="_blank">Unsplash</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="./script.js"></script>
</body>

</html>
